name: Import Letta Code upstream
# Trigger source import from main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-letta-code.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Yorimiyu
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Clone Letta Code upstream (do not execute)
        run: git clone --depth 1 https://github.com/letta-ai/letta-code.git /tmp/letta-code
      - name: Preserve source snapshot and license
        shell: bash
        run: |
          test -f /tmp/letta-code/LICENSE
          test -f /tmp/letta-code/README.md
          mkdir -p vendor/letta-code
          rsync -a --delete --exclude='.git/' /tmp/letta-code/ vendor/letta-code/
          git -C /tmp/letta-code rev-parse HEAD > vendor/letta-code/UPSTREAM_COMMIT
          test -f vendor/letta-code/LICENSE
          test -f vendor/letta-code/README.md
      - name: Commit complete upstream snapshot to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/letta-code
          if git diff --cached --quiet; then
            echo "Letta Code snapshot already current"
            exit 0
          fi
          git commit -m "Vendor complete Letta Code upstream snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
